[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-clip-classifier"
version = "0.1.0"
description = "Classify what happens in every 5-10s window of a DIY (candle-making) YouTube video."
requires-python = ">=3.9"
dependencies = [
    "yt-dlp>=2025.1.1",
    "scenedetect>=0.6",
    "opencv-python-headless>=4.8",
    "Pillow>=10.0",
    "requests>=2.31",
    "PyYAML>=6.0",
]

[project.scripts]
ytclip = "ytclip.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
